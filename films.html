<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фільми, які доступні на нашому сайті</title>
  <link rel="stylesheet" href="films.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand"><img src="logo.png" alt="Логотип"></a>
  </header>

  <main>
    <h1>Фільми, які доступні на нашому сайті</h1>
    <ul class="grid">
      <li class="card c1"><a class="card-link" href="film.html?id=sonic" target="_blank" rel="noopener"><img src="sonic.png" alt="Постер фільму «Сонік»"><h2>Сонік</h2></a></li>
      <li class="card c2"><a class="card-link" href="film.html?id=supermario" target="_blank" rel="noopener"><img src="supermario.png" alt="Постер фільму «Супер Маріо»"><h2>Супер Маріо</h2></a></li>
      <li class="card c3"><a class="card-link" href="film.html?id=paddington" target="_blank" rel="noopener"><img src="paddington.png" alt="Постер фільму «Пригоди Паддінгтона»"><h2>Пригоди Паддінгтона</h2></a></li>
      <li class="card c4"><a class="card-link" href="film.html?id=charlie" target="_blank" rel="noopener"><img src="charlie.png" alt="Постер фільму «Чарлі та шоколадна фабрика»"><h2>Чарлі та шоколадна фабрика</h2></a></li>
      <li class="card c5"><a class="card-link" href="film.html?id=interstellar" target="_blank" rel="noopener"><img src="interstellar.png" alt="Постер фільму «Інтерстелар»"><h2>Інтерстелар</h2></a></li>
      <li class="card c6"><a class="card-link" href="film.html?id=harrypotter" target="_blank" rel="noopener"><img src="harrypotter.png" alt="Постер фільму «Гаррі Поттер»"><h2>Гаррі Поттер</h2></a></li>
      <li class="card c7"><a class="card-link" href="film.html?id=backtofuture" target="_blank" rel="noopener"><img src="backtofuture.png" alt="Постер фільму «Назад у майбутнє»"><h2>Назад у майбутнє</h2></a></li>
      <li class="card c8"><a class="card-link" href="film.html?id=spiderman" target="_blank" rel="noopener"><img src="spiderman.png" alt="Постер фільму «Людина-павук»"><h2>Людина-павук</h2></a></li>
      <li class="card c9"><a class="card-link" href="film.html?id=soul" target="_blank" rel="noopener"><img src="soul.png" alt="Постер фільму «Душа»"><h2>Душа</h2></a></li>
    </ul>
  </main>

  <nav class="side-nav" aria-label="Додатково">
    <button type="button" class="wtw-btn" id="wtwBtn" aria-expanded="false" aria-controls="wtwPopup">Що подивитися?</button>
    <a class="wtw-btn" href="facts.html">Цікаві факти</a>
  </nav>
  <div class="wtw-popup" id="wtwPopup" role="dialog" aria-label="Що подивитися?" aria-live="polite" hidden>
    <div class="wtw-loading" id="wtwLoading">
      <span class="wtw-spinner" aria-hidden="true"></span>
      <p id="wtwLoadingText"></p>
    </div>
    <div class="wtw-result" id="wtwResult" hidden>
      <p class="wtw-lead">Сьогодні зірки кажуть подивитися:</p>
      <p class="wtw-film" id="wtwFilm"></p>
    </div>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('wtwBtn');
      var popup = document.getElementById('wtwPopup');
      var loading = document.getElementById('wtwLoading');
      var loadingText = document.getElementById('wtwLoadingText');
      var result = document.getElementById('wtwResult');
      var filmEl = document.getElementById('wtwFilm');
      var messages = [
        'Робимо прогноз від сонячної системи',
        'Знаходимо закономірність зірок'
      ];
      var timer = null;

      function films() {
        return Array.prototype.map.call(document.querySelectorAll('.card h2'), function (h) {
          return h.textContent.trim();
        });
      }

      function open() {
        var list = films();
        loadingText.textContent = messages[Math.floor(Math.random() * messages.length)];
        loading.hidden = false;
        result.hidden = true;
        popup.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
        clearTimeout(timer);
        timer = setTimeout(function () {
          filmEl.textContent = list[Math.floor(Math.random() * list.length)];
          loading.hidden = true;
          result.hidden = false;
        }, 3000);
      }

      function close() {
        clearTimeout(timer);
        popup.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
      }

      btn.addEventListener('click', function () {
        if (popup.hidden) { open(); } else { close(); }
      });
    })();
  </script>
</body>
</html>
