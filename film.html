    (function () {
      var id = new URLSearchParams(location.search).get('id');
      var film = FILMS[id];
      var titleEl = document.getElementById('filmTitle');
      if (!film) {
        document.title = 'Фільм не знайдено';
        document.getElementById('filmPoster').hidden = true;
        titleEl.textContent = 'Фільм не знайдено';
        return;
      }
      document.title = film.title;
      var poster = document.getElementById('filmPoster');
      poster.src = film.img;
      poster.alt = 'Постер фільму «' + film.title + '»';
      titleEl.textContent = film.title;
      var facts = document.getElementById('filmFacts');
      [
        ['Рейтинг:', film.rating + ' / 10 (IMDb)'],
        ['Рік:', String(film.year)],
        ['Жанр:', film.genres.join(', ')]
      ].forEach(function (row) {
        var dt = document.createElement('dt');
        var dd = document.createElement('dd');
        dt.textContent = row[0];
        dd.textContent = row[1];
        facts.appendChild(dt);
        facts.appendChild(dd);
      });
      var desc = document.getElementById('filmDesc');
      film.text.forEach(function (t) {
        var p = document.createElement('p');
        p.textContent = t;
        desc.appendChild(p);
      });
      if (film.video) {
        var frame = document.getElementById('trailerFrame');
        frame.style.aspectRatio = film.video.w + ' / ' + film.video.h;
        var iframe = document.createElement('iframe');
        iframe.src = 'https://www.youtube.com/embed/' + film.video.id;
        iframe.title = film.video.title;
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.allowFullscreen = true;
        frame.appendChild(iframe);
        document.getElementById('trailerLink').href = 'https://www.youtube.com/watch?v=' + film.video.id;
        document.getElementById('filmTrailer').hidden = false;
      }
    })();
